services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
      POSTGRES_DB: inventario
    ports:
      - "5432:5432"
  api:
    build: .
    environment:
      DATABASE_URL: postgres://inventario:inventario@db:5432/inventario
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - db
